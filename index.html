<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎅 クリスマスバーイベント注文フォーム 🎁</title>

<style>
  :root {
    --bg:#fff8f8;
    --card:#ffffff;
    --border:#e5e5e5;
    --txt:#222;
    --muted:#777;
    --accent-red:#e63946;
    --accent-green:#2a9d8f;
    --btn-shadow:0 4px 8px rgba(0,0,0,0.15);
  }

  body {
    margin:0;
    background:var(--bg);
    font-family:"Nunito","ヒラギノ角ゴ ProN","Meiryo",sans-serif;
    color:var(--txt);
  }

  .wrap {
    max-width:480px;
    margin:0 auto;
    padding:16px;
  }

  .card {
    background:var(--card);
    border-radius:16px;
    padding:24px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    border:3px solid var(--accent-green);
    background-image: radial-gradient(circle at top left, #fff5f5, #f9fffa);
  }

  h1 {
    text-align:center;
    font-size:22px;
    color:var(--accent-red);
    margin-bottom:12px;
  }
  h1::after {
    content:"🎄";
    display:block;
    font-size:28px;
    margin-top:4px;
  }

  .row { margin:16px 0; }
  label { font-weight:600; color:var(--accent-green); }

  input, textarea {
    width:100%;
    padding:10px;
    border-radius:10px;
    border:2px solid var(--accent-green);
    font-size:16px;
    box-sizing:border-box;
  }

  textarea {
    min-height:80px;
    resize:vertical;
  }

  /* --- カテゴリカード --- */
  .cat {
    border:2px dashed var(--accent-green);
    border-radius:12px;
    padding:14px;
    margin-top:16px;
    background:#fffefa;
  }

  .cat h3 {
    margin:0;
    font-size:18px;
    color:var(--accent-red);
    display:flex;
    justify-content:space-between;
    align-items:center;
    white-space:nowrap;
  }

  .cat h3 span {
    flex-grow:1;
    padding-right:10px;
  }

  .cat input[type="checkbox"] {
    width:22px;
    height:22px;
    accent-color:var(--accent-green);
  }

  .items {
    display:none;
    grid-template-columns:1fr auto;
    gap:10px 8px;
    margin-top:10px;
    padding-left:4px;
  }

  .qty {
    width:70px;
    padding:6px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:15px;
  }

  /* キャストドリンクの中のブロック */
  .cast-type-block {
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
    margin-top:8px;
    background:#ffffff;
  }
  .cast-type-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    font-weight:600;
  }
  .cast-type-header span {
    flex-grow:1;
    padding-right:8px;
  }
  .cast-list {
    display:none;
    margin-top:6px;
  }
  .cast-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:4px 0;
    font-size:14px;
  }
  .cast-row span {
    margin-right:8px;
  }

  .btn {
    width:100%;
    background:linear-gradient(135deg,var(--accent-red),var(--accent-green));
    color:#fff;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    box-shadow:var(--btn-shadow);
    margin-top:10px;
  }

  #result {
    margin-top:18px;
    text-align:center;
    font-weight:700;
    color:var(--accent-green);
  }

  .confirm-box {
    white-space:pre-wrap;
    padding:12px;
    border-radius:10px;
    background:#fff;
    border:2px solid var(--accent-green);
    margin-top:12px;
  }

  /* --- ローディング（雪だるま） --- */
  #loading {
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(3px);
    z-index:999;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:20px;
    color:var(--accent-green);
  }

  .snowman {
    font-size:60px;
    animation:spin 1.2s linear infinite;
  }
  @keyframes spin {
    0% { transform:rotate(0deg); }
    100% { transform:rotate(360deg); }
  }
</style>
</head>

<body>

<!-- ローディング -->
<div id="loading">
  <div class="snowman">⛄</div>
  <div>読み込み中…</div>
</div>

<div class="wrap">
  <div class="card">

    <h1>ご注文フォーム</h1>

    <div class="row">
      <label>お客様番号（半角数字）</label>
      <input type="text" id="customerId" inputmode="numeric" placeholder="例: 101">
    </div>

    <div id="categories"></div>

    <div class="row">
      <label>備考（任意）</label>
      <textarea id="note" placeholder="自由に記述してください"></textarea>
    </div>

    <button class="btn" id="confirmBtn">注文内容確認</button>
    <div id="confirmArea"></div>

    <button class="btn" id="submitBtn" style="display:none">送信！</button>

    <div id="result"></div>

  </div>
</div>

<script>
/*****************************************
 * API URL（Workers）
 *****************************************/
const API_MENU  = "https://mute-forest-8746.matsuno12199.workers.dev/menu";
const API_ORDER = "https://mute-forest-8746.matsuno12199.workers.dev/order";


let GLOBAL_MENU  = {};
let GLOBAL_CASTS = [];

/*****************************************
 * ローディング表示 & 非表示
 *****************************************/
function showLoading() {
  document.getElementById("loading").style.display = "flex";
}
function hideLoading() {
  document.getElementById("loading").style.display = "none";
}

/*****************************************
 * メニュー取得
 *****************************************/
async function loadMenu() {
  showLoading();
  try {
    const r = await fetch(API_MENU);
    const json = await r.json();

    if (!json.success) {
      alert("メニュー取得に失敗しました");
      hideLoading();
      return;
    }

    GLOBAL_MENU  = json.menu || {};
    GLOBAL_CASTS = json.casts || [];
    renderMenu();
  } catch (err) {
    alert("メニュー取得に失敗しました");
  }
  hideLoading();
}

/*****************************************
 * メニュー描画
 *****************************************/
function renderMenu() {
  const area = document.getElementById("categories");
  area.innerHTML = "";

  Object.keys(GLOBAL_MENU).forEach(cat => {
    if (cat === "キャストドリンク") {
      renderCastDrinkCategory(area, cat, GLOBAL_MENU[cat], GLOBAL_CASTS);
    } else {
      renderNormalCategory(area, cat, GLOBAL_MENU[cat]);
    }
  });
}

/* 通常カテゴリ（ソフトドリンクなど） */
function renderNormalCategory(parent, catName, items) {
  const catBox = document.createElement("div");
  catBox.className = "cat";

  const h = document.createElement("h3");
  const title = document.createElement("span");
  title.textContent = catName;

  const chk = document.createElement("input");
  chk.type = "checkbox";

  h.appendChild(title);
  h.appendChild(chk);
  catBox.appendChild(h);

  const itemsDiv = document.createElement("div");
  itemsDiv.className = "items";

  items.forEach(i => {
    const name = document.createElement("div");
    name.textContent = `${i.name} ¥${i.price}`;

    const qty = document.createElement("input");
    qty.type = "number";
    qty.min = 0;
    qty.max = 9;
    qty.value = 0;
    qty.className = "qty";
    qty.dataset.kind = "normal";
    qty.dataset.category = catName;
    qty.dataset.name = i.name;

    // 0〜9から絶対に外れないようにする
    qty.addEventListener("input", () => {
      let v = Number(qty.value);
      if (isNaN(v) || v < 0) v = 0;
      if (v > 9) v = 9;
      qty.value = v;
    });

    itemsDiv.append(name, qty);
  });

  chk.addEventListener("change", () => {
    itemsDiv.style.display = chk.checked ? "grid" : "none";
    if (!chk.checked) {
      itemsDiv.querySelectorAll("input").forEach(i => i.value = 0);
    }
  });

  catBox.appendChild(itemsDiv);
  parent.appendChild(catBox);
}

/* キャストドリンクカテゴリ */
function renderCastDrinkCategory(parent, catName, items, casts) {
  const catBox = document.createElement("div");
  catBox.className = "cat";

  const h = document.createElement("h3");
  const title = document.createElement("span");
  title.textContent = catName;

  const chk = document.createElement("input");
  chk.type = "checkbox";

  h.appendChild(title);
  h.appendChild(chk);
  catBox.appendChild(h);

  const itemsWrapper = document.createElement("div");
  itemsWrapper.className = "items";

  // 「キャストドリンク」の中の 各種別（ソフトドリンク / アルコール など）
  items.forEach(i => {
    const typeBlock = document.createElement("div");
    typeBlock.className = "cast-type-block";

    const header = document.createElement("div");
    header.className = "cast-type-header";

    const typeLabel = document.createElement("span");
    typeLabel.textContent = `${i.name} ¥${i.price}`;

    const typeChk = document.createElement("input");
    typeChk.type = "checkbox";

    header.appendChild(typeLabel);
    header.appendChild(typeChk);
    typeBlock.appendChild(header);

    const castList = document.createElement("div");
    castList.className = "cast-list";

    // 各キャストごとに数量欄
    casts.forEach(castName => {
      const row = document.createElement("div");
      row.className = "cast-row";

      const castLabel = document.createElement("span");
      castLabel.textContent = castName;

      const qty = document.createElement("input");
      qty.type = "number";
      qty.min = 0;
      qty.max = 9;
      qty.value = 0;
      qty.className = "qty";
      qty.dataset.kind = "cast";
      qty.dataset.category = catName;
      qty.dataset.type = i.name;      // ソフトドリンク / アルコール
      qty.dataset.cast = castName;    // キャスト名

      qty.addEventListener("input", () => {
        let v = Number(qty.value);
        if (isNaN(v) || v < 0) v = 0;
        if (v > 9) v = 9;
        qty.value = v;
      });

      row.appendChild(castLabel);
      row.appendChild(qty);
      castList.appendChild(row);
    });

    // 種別チェックONでこのcastListだけ表示
    typeChk.addEventListener("change", () => {
      castList.style.display = typeChk.checked ? "block" : "none";
      if (!typeChk.checked) {
        castList.querySelectorAll("input").forEach(inp => inp.value = 0);
      }
    });

    typeBlock.appendChild(castList);
    itemsWrapper.appendChild(typeBlock);
  });

  // カテゴリレベルのチェックで itemsWrapper を開閉
  chk.addEventListener("change", () => {
    itemsWrapper.style.display = chk.checked ? "block" : "none";
    if (!chk.checked) {
      // 中の種別チェックもリセット
      itemsWrapper.querySelectorAll("input[type='checkbox']").forEach(c => {
        c.checked = false;
      });
      // 数量0 & castList非表示
      itemsWrapper.querySelectorAll(".qty").forEach(q => q.value = 0);
      itemsWrapper.querySelectorAll(".cast-list").forEach(cl => {
        cl.style.display = "none";
      });
    }
  });

  catBox.appendChild(itemsWrapper);
  parent.appendChild(catBox);
}

/*****************************************
 * 注文収集
 *****************************************/
function collectOrders() {
  const arr = [];
  document.querySelectorAll(".qty").forEach(q => {
    const v = Number(q.value || 0);
    if (v <= 0) return;

    const kind = q.dataset.kind;

    if (kind === "cast") {
      // キャストドリンク専用
      arr.push({
        category: q.dataset.category, // "キャストドリンク"
        type:     q.dataset.type,     // ソフトドリンク / アルコール
        cast:     q.dataset.cast,
        qty:      v
      });
    } else {
      // 通常ドリンク
      arr.push({
        category: q.dataset.category,
        name:     q.dataset.name,
        qty:      v
      });
    }
  });
  return arr;
}

/*****************************************
 * 注文内容確認
 *****************************************/
document.getElementById("confirmBtn").onclick = () => {
  const customerId = document.getElementById("customerId").value.trim();
  if (!/^\d+$/.test(customerId)) {
    alert("お客様番号は半角数字のみ");
    return;
  }

  const orders = collectOrders();
  if (orders.length === 0) {
    alert("注文がありません");
    return;
  }

  // 表示用にテキスト整形
  const lines = orders.map(o => {
    if (o.category === "キャストドリンク") {
      return `【キャスト】${o.cast}：${o.type} × ${o.qty}`;
    } else {
      return `${o.name} × ${o.qty}`;
    }
  }).join("\n");

  document.getElementById("confirmArea").innerHTML =
    `<div class="confirm-box">【注文内容】\n${lines}</div>`;

  document.getElementById("submitBtn").style.display = "block";
};

/*****************************************
 * 注文送信
 *****************************************/
document.getElementById("submitBtn").onclick = async () => {
  const customerId = document.getElementById("customerId").value.trim();
  const note       = document.getElementById("note").value.trim();
  const orders     = collectOrders();

  if (!/^\d+$/.test(customerId)) {
    alert("お客様番号は半角数字のみ");
    return;
  }
  if (orders.length === 0) {
    alert("注文がありません");
    return;
  }

  showLoading();
  try {
    const r = await fetch(API_ORDER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customerId, note, orders })
    });
    const json = await r.json();
    if (!json.success) {
      alert("エラー：" + (json.error || "unknown"));
      hideLoading();
      return;
    }

    document.getElementById("result").innerHTML =
      `🎉 今回の合計：¥${json.thisTotal}<br>💰 累計：¥${json.cumulative}`;

    // 完全初期化
    document.getElementById("customerId").value = "";
    document.getElementById("note").value = "";
    document.querySelectorAll(".qty").forEach(q => q.value = 0);
    document.querySelectorAll(".cat input[type='checkbox']").forEach(c => c.checked = false);
    document.querySelectorAll(".items").forEach(i => i.style.display = "none");
    document.querySelectorAll(".cast-list").forEach(cl => cl.style.display = "none");
    document.getElementById("confirmArea").innerHTML = "";
    document.getElementById("submitBtn").style.display = "none";

  } catch (err) {
    alert("通信エラー：" + err.message);
  }
  hideLoading();
};

/*****************************************
 * 初回ロード
 *****************************************/
loadMenu();
</script>
</body>
</html>
